name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A new push to a branch supersedes the run already in flight for it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  versions:
    name: Version and changelog
    # Catches a hand-edited manifest in seconds, where the release workflow would
    # only catch it at tag time.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check versions agree
        shell: pwsh
        run: ./tool/check-version.ps1

  rust:
    name: Engine (core)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --all

  flutter:
    name: UI (app)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Format
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  linux:
    name: Linux app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      # Flutter's Linux toolchain and GTK, the tray plugin's appindicator, and
      # Xvfb for the launch check.
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libayatana-appindicator3-dev xvfb

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build
        run: flutter build linux --release

      # Launch from outside app/ so the loader cannot pick up
      # core/target/release, then check the engine came from the bundle's lib/.
      - name: Engine loads from the bundle
        working-directory: ${{ runner.temp }}
        run: |
          bundle="$GITHUB_WORKSPACE/app/build/linux/x64/release/bundle"
          ls -l "$bundle/lib"
          status=0
          xvfb-run -a env LD_DEBUG=libs LD_DEBUG_OUTPUT="$RUNNER_TEMP/ld" \
            timeout 20 "$bundle/shinsoku" > app.log 2>&1 || status=$?
          cat app.log
          # the search path line names the RUNPATH the engine was found through
          grep -h -A3 "find library=libshinsoku_core.so" "$RUNNER_TEMP"/ld.* || true
          # 124 = still running when timeout stopped it
          test "$status" -eq 124
          grep -q "calling init: $bundle/lib/libshinsoku_core.so" "$RUNNER_TEMP"/ld.*
          ! grep -q "Unhandled Exception" app.log

  android:
    name: Android app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      # Gradle's buildRustEngine task runs it for each ABI.
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build APKs
        run: |
          flutter build apk --debug --flavor foss
          flutter build apk --debug --flavor play

      # GitHub releases and F-Droid ship the foss build, which must carry no Google
      # code. A dependency that pulls some in fails here rather than at review.
      - name: No Google code in the foss build
        run: |
          apk=build/app/outputs/flutter-apk/app-foss-debug.apk
          if unzip -p "$apk" 'classes*.dex' |
            grep -a -q -E 'Lcom/android/billingclient/|Lcom/google/android/gms/|Lcom/google/firebase/'; then
            echo "::error::$apk contains Play Billing, Play services or Firebase classes"
            exit 1
          fi
