name: Bug report
description: Something behaves wrongly
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. If this is security-sensitive, please read
        [SECURITY.md](https://github.com/Purukitto/Shinsoku/blob/main/SECURITY.md)
        instead of filing here.

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
      placeholder: |
        Paused a 4 GB download at 60 % with 8 connections and resumed it.
        It restarted from 0 % instead of carrying on.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the URL if it is public — whether a server honours range requests decides a lot.
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: dropdown
    id: build
    attributes:
      label: Which build
      options:
        - Release zip from GitHub
        - Built from source (--release)
        - Built from source (debug)
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Shown at the foot of the sidebar, or the commit if you built it yourself.
      placeholder: 0.1.0
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11 Pro 24H2
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Which part is involved
      multiple: true
      options:
        - Downloading, pause or resume
        - Queue or speed limit
        - Off-peak window
        - Checksum verification
        - HLS / m3u8 streams
        - Browser extension or pairing
        - Clipboard monitor
        - Settings or persistence
        - Window, tray or update notice
        - Not sure

  - type: input
    id: browser
    attributes:
      label: Browser and extension version
      description: Only if the extension is involved.
      placeholder: Firefox 131, Shinsoku Capture 0.1.0

  - type: textarea
    id: logs
    attributes:
      label: Diagnostics
      description: >
        The error shown on the download's detail screen, and for the extension the
        background console (`chrome://extensions` → Inspect views, or
        `about:debugging` → Inspect).
      render: text

  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Screenshots, connection count, whether it happens with one connection.
