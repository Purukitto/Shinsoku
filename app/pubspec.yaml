name: shinsoku
description: "Shinsoku — cross-platform download manager"
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.1.0
  flutter_rust_bridge: 2.9.0
  package_info_plus: ^8.0.0
  path_provider: ^2.1.5
  riverpod_annotation: ^4.0.0
  tray_manager: ^0.5.3
  url_launcher: ^6.3.3
  window_manager: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.6.1
  riverpod_generator: ^4.0.0+1
  custom_lint: ^0.8.1
  riverpod_lint: ^3.1.0

flutter:
  uses-material-design: true

  assets:
    - assets/icon/
    - assets/logo/

  fonts:
    - family: SpaceGrotesk
      fonts:
        - asset: fonts/SpaceGrotesk-Variable.ttf
    - family: JetBrainsMono
      fonts:
        - asset: fonts/JetBrainsMono-Variable.ttf
