[package]
name = "shinsoku_core"
version = "0.1.0"
edition = "2021"

[lib]
name = "shinsoku_core"
# rlib so Rust integration tests (and the codegen) can link the library, in
# addition to the cdylib/staticlib consumed by the Flutter native build.
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
flutter_rust_bridge = "=2.9.0"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
reqwest = { version = "0.12", features = ["stream", "json", "rustls-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
md-5 = "0.10"
anyhow = "1"
thiserror = "1"
futures = "0.3"
bytes = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tokio-test = "0.4"
